name: Signed Play release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blanket-signed-play-release
  cancel-in-progress: false

jobs:
  build-signed-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Detect signing secrets
        id: signing-secrets
        env:
          BLANKET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BLANKET_UPLOAD_KEYSTORE_BASE64 }}
          BLANKET_KEYSTORE_PASSWORD: ${{ secrets.BLANKET_KEYSTORE_PASSWORD }}
          BLANKET_KEY_ALIAS: ${{ secrets.BLANKET_KEY_ALIAS }}
          BLANKET_KEY_PASSWORD: ${{ secrets.BLANKET_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in \
            BLANKET_UPLOAD_KEYSTORE_BASE64 \
            BLANKET_KEYSTORE_PASSWORD \
            BLANKET_KEY_ALIAS \
            BLANKET_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=( "$name" )
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            {
              echo "### Signed release preflight"
              echo "All required signing secrets are configured."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Signed release not run"
              echo
              echo "The workflow was not configured for signing. Missing secrets:"
              for name in "${missing[@]}"; do
                echo "- `$name`"
              done
              echo
              echo "Add the secrets and run this workflow again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Signed AAB steps skipped because signing secrets are missing."
          fi

      - name: Restore upload keystore
        if: steps.signing-secrets.outputs.configured == 'true'
        env:
          BLANKET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BLANKET_UPLOAD_KEYSTORE_BASE64 }}
          BLANKET_KEYSTORE_PASSWORD: ${{ secrets.BLANKET_KEYSTORE_PASSWORD }}
          BLANKET_KEY_ALIAS: ${{ secrets.BLANKET_KEY_ALIAS }}
          BLANKET_KEYSTORE_FILE: ${{ runner.temp }}/blanket-signing/blanket-upload-key.jks
        shell: bash
        run: |
          umask 077
          mkdir -p "$(dirname "$BLANKET_KEYSTORE_FILE")"
          printf '%s' "$BLANKET_UPLOAD_KEYSTORE_BASE64" \
            | base64 --decode > "$BLANKET_KEYSTORE_FILE"
          keytool -list \
            -keystore "$BLANKET_KEYSTORE_FILE" \
            -storepass "$BLANKET_KEYSTORE_PASSWORD" \
            -alias "$BLANKET_KEY_ALIAS" > /dev/null

      - name: Test and build signed Play bundle
        if: steps.signing-secrets.outputs.configured == 'true'
        env:
          BLANKET_KEYSTORE_FILE: ${{ runner.temp }}/blanket-signing/blanket-upload-key.jks
          BLANKET_KEYSTORE_PASSWORD: ${{ secrets.BLANKET_KEYSTORE_PASSWORD }}
          BLANKET_KEY_ALIAS: ${{ secrets.BLANKET_KEY_ALIAS }}
          BLANKET_KEY_PASSWORD: ${{ secrets.BLANKET_KEY_PASSWORD }}
        run: ./gradlew lintDebug testDebugUnitTest buildBlanketReleaseBundle --stacktrace

      - name: Verify AAB signature
        if: steps.signing-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          unzip -l dist/blanket.aab \
            | grep -Eq 'META-INF/.*\.(RSA|DSA|EC)$'
          jarsigner -verify -verbose -certs dist/blanket.aab \
            | tee "$RUNNER_TEMP/jarsigner-verification.txt"
          grep -q "jar verified." "$RUNNER_TEMP/jarsigner-verification.txt"

      - name: Upload signed Play bundle
        if: steps.signing-secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: blanket-signed-play-aab
          path: dist/blanket.aab
          if-no-files-found: error
          retention-days: 30

      - name: Confirm skipped signing
        if: steps.signing-secrets.outputs.configured != 'true'
        run: echo "No signed artifact was produced because signing secrets are missing."
