- pipeline: blanket
  name: Blanket
  refs:
  - refs/heads/*
  fail_on_prepare_env_warning: true
  resources: X2LARGE
  events:
  - type: WEBHOOK
  actions:
  - action: Build Release APK
    type: BUILD
    execute_commands:
    - export ANDROID_HOME="/opt/android/sdk"
    - export PATH=$PATH:/opt/android/sdk/cmdline-tools/tools/bin
    - "if [ ! -d \"$ANDROID_HOME/cmdline-tools\" ]; then"
    - ' curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip'
    - ' unzip sdk.zip'
    - ' rm sdk.zip'
    - ' mkdir "$ANDROID_HOME/cmdline-tools"'
    - ' mv cmdline-tools "$ANDROID_HOME/cmdline-tools/tools"'
    - ' yes | "$ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager" --licenses'
    - fi
    - ""
    - chmod +x gradlew
    - "#./gradlew assembleDebug"
    - ./gradlew assembleRelease
    setup_commands:
    - microdnf install unzip
    cached_dirs:
    - /root/.gradle
    - /opt/android/sdk
    shell: BASH
    image_location: ACTION
    docker_registry: DOCKER_HUB
  - action: Build Release APK (Retry on Failure)
    type: BUILD
    trigger_time: ON_FAILURE
    execute_commands:
    - export ANDROID_HOME="/opt/android/sdk"
    - export PATH=$PATH:/opt/android/sdk/cmdline-tools/tools/bin
    - "if [ ! -d \"$ANDROID_HOME/cmdline-tools\" ]; then"
    - ' curl -o sdk.zip https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip'
    - ' unzip sdk.zip'
    - ' rm sdk.zip'
    - ' mkdir "$ANDROID_HOME/cmdline-tools"'
    - ' mv cmdline-tools "$ANDROID_HOME/cmdline-tools/tools"'
    - ' yes | "$ANDROID_HOME/cmdline-tools/tools/bin/sdkmanager" --licenses'
    - fi
    - ""
    - chmod +x gradlew
    - "#./gradlew assembleDebug"
    - ./gradlew assembleRelease
    setup_commands:
    - microdnf install unzip
    cached_dirs:
    - /root/.gradle
    - /opt/android/sdk
    shell: BASH
    image_location: DOCKER_HUB
    docker_image_name: library/openjdk
    docker_image_tag: "24"
