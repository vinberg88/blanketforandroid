name: Signed APK release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blanket-signed-apk-release
  cancel-in-progress: false

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Detect signing secrets
        id: signing-secrets
        env:
          BLANKET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BLANKET_UPLOAD_KEYSTORE_BASE64 }}
          BLANKET_KEYSTORE_PASSWORD: ${{ secrets.BLANKET_KEYSTORE_PASSWORD }}
          BLANKET_KEY_ALIAS: ${{ secrets.BLANKET_KEY_ALIAS }}
          BLANKET_KEY_PASSWORD: ${{ secrets.BLANKET_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=()
          for name in \
            BLANKET_UPLOAD_KEYSTORE_BASE64 \
            BLANKET_KEYSTORE_PASSWORD \
            BLANKET_KEY_ALIAS \
            BLANKET_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              missing+=( "$name" )
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed APK steps skipped because signing secrets are missing."
          fi

      - name: Restore upload keystore
        if: steps.signing-secrets.outputs.configured == 'true'
        env:
          BLANKET_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BLANKET_UPLOAD_KEYSTORE_BASE64 }}
          BLANKET_KEYSTORE_FILE: ${{ runner.temp }}/blanket-signing/blanket-upload-key.jks
          BLANKET_KEYSTORE_PASSWORD: ${{ secrets.BLANKET_KEYSTORE_PASSWORD }}
          BLANKET_KEY_ALIAS: ${{ secrets.BLANKET_KEY_ALIAS }}
        shell: bash
        run: |
          set +e
          umask 077
          mkdir -p "$(dirname "$BLANKET_KEYSTORE_FILE")"
          echo "Base64 secret length (chars):"
          printf '%s' "$BLANKET_UPLOAD_KEYSTORE_BASE64" | wc -c
          printf '%s' "$BLANKET_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$BLANKET_KEYSTORE_FILE"
          echo "base64 decode exit code: $?"
          echo "Decoded keystore file size (bytes):"
          wc -c < "$BLANKET_KEYSTORE_FILE"
          echo "Decoded keystore sha256:"
          sha256sum "$BLANKET_KEYSTORE_FILE"
          echo "Running keytool -list (verbose, not suppressed)..."
          keytool -list -keystore "$BLANKET_KEYSTORE_FILE" -storepass "$BLANKET_KEYSTORE_PASSWORD" -alias "$BLANKET_KEY_ALIAS"
          KEYTOOL_EXIT=$?
          echo "keytool exit code: $KEYTOOL_EXIT"
          exit $KEYTOOL_EXIT

      - name: Test and build signed release APK
        if: steps.signing-secrets.outputs.configured == 'true'
        env:
          BLANKET_KEYSTORE_FILE: ${{ runner.temp }}/blanket-signing/blanket-upload-key.jks
          BLANKET_KEYSTORE_PASSWORD: ${{ secrets.BLANKET_KEYSTORE_PASSWORD }}
          BLANKET_KEY_ALIAS: ${{ secrets.BLANKET_KEY_ALIAS }}
          BLANKET_KEY_PASSWORD: ${{ secrets.BLANKET_KEY_PASSWORD }}
        run: ./gradlew lintDebug testDebugUnitTest buildBlanketReleaseApk --stacktrace

      - name: Verify APK signature
        if: steps.signing-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose dist/blanket.apk

      - name: Generate checksum
        if: steps.signing-secrets.outputs.configured == 'true'
        shell: bash
        run: |
          cd dist
          sha256sum blanket.apk > blanket.apk.sha256

      - name: Upload signed APK artifact
        if: steps.signing-secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: blanket-signed-apk
          path: |
            dist/blanket.apk
            dist/blanket.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: steps.signing-secrets.outputs.configured == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/blanket.apk
            dist/blanket.apk.sha256
          generate_release_notes: true
          draft: false

      - name: Confirm skipped signing
        if: steps.signing-secrets.outputs.configured != 'true'
        run: echo "No signed APK was produced because signing secrets are missing."
